[package]
name = "clawhip"
version = "0.6.11"
edition = "2024"
description = "Event-to-channel notification router for Discord — bypass gateway sessions, just events in, messages out"
license = "MIT"
repository = "https://github.com/Yeachan-Heo/clawhip"
keywords = ["discord", "notifications", "tmux", "github", "devops"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8" }
clap = { version = "4.5", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = "0.3"
ring = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.45", features = ["full"] }
time = { version = "0.3", features = ["formatting", "parsing"] }
uuid = { version = "1", features = ["v4"] }
toml = "0.8"
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# ws is test-only: the deterministic fake SDK endpoint fixture upgrades
# websockets; production serves plain HTTP/JSON.
axum = { version = "0.8", features = ["ws"] }
serial_test = "3"
tempfile = "3.15"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
